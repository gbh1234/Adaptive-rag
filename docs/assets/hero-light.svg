<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Adaptive-RAG 多智能体电商客服">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#F2F6FC"/>
      <stop offset="100%" stop-color="#E8EFF9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="-8%" r="78%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#A5B4FC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#0284C7" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="18" fill="none" stroke="#C7D7EA" stroke-width="1.5"/>
  <rect x="18" y="0" width="1164" height="3" rx="1.5" fill="url(#bar)"/>

  <text x="600" y="78" text-anchor="middle" fill="#0369A1" font-size="14" font-weight="600"
        letter-spacing="3.2"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">ADAPTIVE-RAG · MULTI-AGENT E-COMMERCE SERVICE</text>

  <text x="600" y="152" text-anchor="middle" fill="#0F172A" font-size="48" font-weight="800"
        font-family="'PingFang SC', 'Microsoft YaHei', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">Adaptive-RAG 多智能体电商客服</text>

  <rect x="540" y="172" width="120" height="4" rx="2" fill="url(#rule)"/>

  <text x="600" y="214" text-anchor="middle" fill="#475569" font-size="20"
        font-family="'PingFang SC', 'Microsoft YaHei', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">按问题复杂度选择检索策略，而不是对所有 query 做一次 top-k 向量检索</text>

  <text x="600" y="262" text-anchor="middle" fill="#64748B" font-size="13"
        font-family="'PingFang SC', 'Microsoft YaHei', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">实测 2026-08-22 · 所有数字以 eval/MEASURED.md 为准</text>
</svg>
